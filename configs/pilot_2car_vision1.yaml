# Pilot: two cars, private route, individual rewards. Coefficients are pilot values, not tuned results.
env:
  n_agents: 2
  grid: 8
  horizon: 20
  vision: 1                   # negative control: b=0 already matches the oracle here
  max_start_offset: 2
  reward_mode: individual     # "team" = cooperative diagnostic only, never the main result
reward:
  reward_arrival: 1.0
  reward_collision: -2.0
  reward_time: -0.05
train:
  num_envs: 16
  rollout_len: 128
  total_steps: 600000         # placeholder; set from measured learning curves
  hidden: 64
  anneal_lr: true
  ppo:
    lr: 0.00025
    gamma: 0.99
    gae_lambda: 0.95
    clip: 0.2
    ent_move: 0.01
    ent_msg: 0.01
    epochs: 4
    minibatches: 4
